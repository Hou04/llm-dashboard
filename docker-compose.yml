# LLM Dashboard — Production Docker Compose

services:

  # ================================================
  # PostgreSQL with TimescaleDB extension
  # TimescaleDB makes time-based queries 10-100x faster
  # Perfect for llm_token_log which is queried by time constantly
  # ================================================
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: llm_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-llmuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-llmpassword}
      POSTGRES_DB: ${POSTGRES_DB:-llmdashboard}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmuser -d llmdashboard"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - llm-net

  # ================================================
  # Redis — in-memory data store
  # Used for quota counters and rule caching
  # Answers in 0.1ms vs PostgreSQL's 20-50ms
  # ================================================
  redis:
    image: redis:7-alpine
    container_name: llm_redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - llm-net

  # ================================================
  # LLM Dashboard API — FastAPI application
  # The main API server serving all endpoints + frontend
  # ================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llm_api
    env_file: .env
    environment:
      # Override DB/Redis URLs to use Docker service names
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-llmuser}:${POSTGRES_PASSWORD:-llmpassword}@postgres:5432/${POSTGRES_DB:-llmdashboard}
      REDIS_URL: redis://redis:6379/0
      REDIS_CACHE_URL: redis://redis:6379/1
      APP_ENV: ${APP_ENV:-production}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped
    networks:
      - llm-net

  # ================================================
  # Celery Worker — background task processor
  # Handles: data ingestion, anomaly detection,
  # forecast generation, billing aggregation
  # ================================================
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llm_worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-llmuser}:${POSTGRES_PASSWORD:-llmpassword}@postgres:5432/${POSTGRES_DB:-llmdashboard}
      REDIS_URL: redis://redis:6379/0
      REDIS_CACHE_URL: redis://redis:6379/1
    command: ["python", "-m", "celery", "-A", "celery_app", "worker",
              "--loglevel=info", "--concurrency=2", "--pool=prefork"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - llm-net

  # ================================================
  # Celery Beat — periodic task scheduler
  # Triggers: hourly aggregation, daily forecasts,
  # anomaly detection sweeps
  # ================================================
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llm_scheduler
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-llmuser}:${POSTGRES_PASSWORD:-llmpassword}@postgres:5432/${POSTGRES_DB:-llmdashboard}
      REDIS_URL: redis://redis:6379/0
      REDIS_CACHE_URL: redis://redis:6379/1
    command: ["python", "-m", "celery", "-A", "celery_app", "beat",
              "--loglevel=info"]
    depends_on:
      - worker
    restart: unless-stopped
    networks:
      - llm-net

  # ================================================
  # Nginx — reverse proxy + TLS termination
  # Serves static files, proxies API requests
  # ================================================
  nginx:
    image: nginx:alpine
    container_name: llm_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - llm-net
    profiles:
      - production   # Only starts with: docker compose --profile production up

# ================================================
# Networks
# ================================================
networks:
  llm-net:
    driver: bridge

# ================================================
# Volumes — persistent storage
# ================================================
volumes:
  postgres_data:
  redis_data: